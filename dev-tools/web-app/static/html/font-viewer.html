<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Font viewer · MuSemantiQ dev tools</title>
    <link rel="preload" href="/html/static-templates/dev-tools-template.html" as="fetch" crossorigin="anonymous">
    <link rel="stylesheet" href="/css/e-ui.css">
    <link rel="stylesheet" href="/css/dev-tools.css">
    <script type="importmap">
      {
        "imports": {
          "#ehtml/": "/js/ehtml/",
          "#ehtml/main": "/js/ehtml/main.js",
          "#e-ui/": "/js/e-ui/",
          "#msq/": "/js/msq/web-components/",
          "#msq-worker/": "/js/msq/worker/",
          "#tools/": "/tools/"
        }
      }
    </script>
    <script type="module">
      import '#e-ui/e-tab.js'
      import '#e-ui/e-file-upload-template.js'
      import '#e-ui/e-dialog.js'
      import '#e-ui/e-confirm.js'
      import '#e-ui/e-toast.js'
      import '#ehtml/main'
    </script>
    <script src="/js/app.js"></script>
    <style>
      :root {
        --e-primary: #222f3e;
        --e-fg: #222f3e;
      }
      #points { width: 100%; min-height: 220px; font-family: var(--e-font-mono); font-size: 12px; }
      [data-metrics] { display: flex; flex-wrap: wrap; gap: var(--e-spacing-md); }
      /* The upload sits beside the pickers rather than under them: it is a way
         of adding to the list, not a step of its own. */
      [data-intake] form { width: 100%; }
    </style>
  </head>
  <body>
    <template
      is="e-wrapper"
      data-src="/html/static-templates/dev-tools-template.html"
      data-where-to-place="main > div > hr"
      data-how-to-place="after">

      <h1 is="e-h">Font viewer</h1>
      <p is="e-p">
        <span is="e-muted">
          Three families are engraved from, and each is tested where it is
          actually used: a music glyph on a stave, a text face in a title and a
          line of lyrics, a chord face over a progression. Every list here is
          read off <code is="e-code">src/drawer/font</code>, so a face you add
          shows up in it.
        </span>
      </p>

      <!--
      Every picker on this page is filled from one of two requests, and the
      templates below say what an option looks like rather than a loop in the
      script building one.

      Both destinations sit outside their e-json on purpose: e-ui gives an
      e-json `display: none`, and a reusable one never unwraps itself, so
      anything left inside would be filled and never seen.
      -->
      <e-json
        id="fonts"
        data-reusable
        data-src="/dev/fonts"
        data-response-name="listed"
        data-actions-on-response="
          if (listed.statusCode !== 200) {
            showError(listed.body.error || `Could not read the fonts: the server answered ${listed.statusCode}.`)
            // Handed over even so: the script is waiting on this, and nothing
            // at all would leave the page stuck with no fonts and no reason.
            window.fontsAnswer = null
            if (window.fontsRead) { fontsRead(null) }
            return
          }
          mapToTemplate('#music-fonts-template', listed.body)
          mapToTemplate('#text-music-fonts-template', listed.body)
          mapToTemplate('#chord-music-fonts-template', listed.body)
          mapToTemplate('#text-fonts-template', listed.body)
          mapToTemplate('#chord-fonts-template', listed.body)
          /*
          Left on the window as well as called in: font-viewer.js is a module,
          and the browser resolves its whole import graph before running any of
          it — so this answer often arrives first, with nothing there yet to
          hand it to. The script picks up whichever came.
          */
          window.fontsAnswer = listed.body
          if (window.fontsRead) { fontsRead(listed.body) }
        "></e-json>

      <!--
      A font is only offered once it has a traced glyph table — `usable` says
      so. One that has an .otf and no table is a font the Music font generator
      has work to do on, and engraving with it would draw nothing.
      -->
      <template is="e-reusable" id="music-fonts-template"
        data-insert-into="#font" data-object-name="listing">
        <template is="e-for-each"
          data-list-to-iterate="${listing.music.filter((one) => one.usable)}"
          data-item-name="font">
          <option data-value="${font.name}" data-text="${font.name}"></option>
        </template>
      </template>
      <template is="e-reusable" id="text-music-fonts-template"
        data-insert-into="#text-music-font" data-object-name="listing">
        <template is="e-for-each"
          data-list-to-iterate="${listing.music.filter((one) => one.usable)}"
          data-item-name="font">
          <option data-value="${font.name}" data-text="${font.name}"></option>
        </template>
      </template>
      <template is="e-reusable" id="chord-music-fonts-template"
        data-insert-into="#chord-music-font" data-object-name="listing">
        <template is="e-for-each"
          data-list-to-iterate="${listing.music.filter((one) => one.usable)}"
          data-item-name="font">
          <option data-value="${font.name}" data-text="${font.name}"></option>
        </template>
      </template>
      <template is="e-reusable" id="text-fonts-template"
        data-insert-into="#text-font" data-object-name="listing">
        <template is="e-for-each"
          data-list-to-iterate="${listing.text.filter((one) => one.usable)}"
          data-item-name="font">
          <option data-value="${font.name}" data-text="${font.name}"></option>
        </template>
      </template>
      <template is="e-reusable" id="chord-fonts-template"
        data-insert-into="#chord-font" data-object-name="listing">
        <template is="e-for-each"
          data-list-to-iterate="${listing['chord-letters'].filter((one) => one.usable)}"
          data-item-name="font">
          <option data-value="${font.name}" data-text="${font.name}"></option>
        </template>
      </template>

      <!--
      The glyph entries: what the scaffold declares, plus anything every traced
      font turns out to hold. Add a glyph to all the music-js fonts by hand and
      it appears here without the scaffold having to hear about it first.
      -->
      <e-json
        id="entries"
        data-reusable
        data-src="/dev/music-js-entries"
        data-response-name="known"
        data-actions-on-response="
          if (known.statusCode !== 200) {
            showError(known.body.error || `Could not read the glyph entries: the server answered ${known.statusCode}.`)
            window.entriesAnswer = null
            if (window.entriesRead) { entriesRead(null) }
            return
          }
          mapToTemplate('#entries-template', known.body)
          window.entriesAnswer = known.body
          if (window.entriesRead) { entriesRead(known.body) }
        "></e-json>

      <template is="e-reusable" id="entries-template"
        data-insert-into="#entry" data-object-name="offered">
        <template is="e-for-each" data-list-to-iterate="${offered.entries}" data-item-name="entry">
          <option
            data-value="${entry.name}"
            data-text="${entry.inScaffold ? entry.name : entry.name + ' — in the fonts only'}"></option>
        </template>
      </template>

      <e-tabs id="families" data-apply-hash-navigation data-margin-top="md">

        <!-- ── Music ─────────────────────────────────────────────────────── -->
        <e-tab data-title="Music">

          <div is="e-card" data-width="full" data-padding="lg" data-margin-top="md">
            <div is="e-row" data-gap="md" data-fields data-align-items="end">
              <label>
                Music font
                <select id="font" is="searchable-select" data-placeholder="Search fonts…"></select>
              </label>
              <label>
                Glyph table entry
                <select id="entry" is="searchable-select" data-placeholder="Search glyph entries…"></select>
              </label>
              <label>
                Character or U+XXXX
                <input id="codepoint" value="U+E050" spellcheck="false">
              </label>
              <label>
                Font size (× interval)
                <input id="size" type="number" value="4.0" step="0.005" min="0.1">
              </label>
              <label>
                Interval between stave lines
                <input id="interval" type="number" value="8.5" step="0.5" min="1">
              </label>
              <label>
                yCorrection
                <input id="correction" type="number" step="0.01" spellcheck="false">
              </label>
            </div>

            <!--
            Two hundred entries is a list you walk rather than search: most of
            the tuning is done by going along it one glyph at a time and seeing
            which ones sit wrong.
            -->
            <div is="e-row" data-gap="sm" data-margin-top="md">
              <button id="previous-glyph" data-primary data-fill="outlined" type="button">
                ← Previous
              </button>
              <button id="next-glyph" data-primary data-fill="outlined" type="button">
                Next →
              </button>
              <span
                is="e-muted"
                data-font-size="sm"
                id="glyph-place"
                data-width="full">
              </span>
            </div>
          </div>

          <div is="e-panel" data-padding="lg" data-margin-top="lg">
            <h2 is="e-h">Engraved example</h2>
            <div id="editor" data-editor></div>
            <p is="e-p" data-margin-top="md"><span is="e-muted" data-font-size="sm" id="status"></span></p>

            <!--
            The example is a file, and this is where it is edited: open the
            source in the editor above, change the music, then keep it. What is
            saved is what the next person sees this glyph in.
            -->
            <div is="e-row" data-gap="sm" data-margin-top="md" data-keep-flex-direction-row-in-mobile>
              <button id="save-example" data-primary data-fill="outlined" type="button">
                Save this example
              </button>
              <div is="e-spacer"></div>
              <span is="e-muted" data-font-size="sm" id="example-says"></span>
            </div>
          </div>

          <div is="e-panel" data-padding="lg" data-margin-top="lg">
            <h2 is="e-h">Points</h2>
            <div data-metrics id="metrics" data-margin-bottom="md"></div>
            <textarea id="points" spellcheck="false" readonly></textarea>
            <div is="e-row" data-gap="sm" data-margin-top="md" data-keep-flex-direction-row-in-mobile>
              <button id="apply" data-primary type="button">Apply</button>
              <button id="copy" data-primary data-fill="outlined" type="button">Copy points</button>
            </div>
            <p is="e-p" data-margin-top="md">
              <span is="e-muted" data-font-size="sm">
                Apply writes the points and the yCorrection above into
                <code is="e-code">src/drawer/font/music-js/&lt;font&gt;.js</code> for the selected
                entry. Nothing on disk changes until you press it.
              </span>
            </p>
          </div>

        </e-tab>

        <!-- ── Text ──────────────────────────────────────────────────────── -->
        <e-tab data-title="Text">

          <div is="e-card" data-width="full" data-padding="lg" data-margin-top="md">
            <div is="e-row" data-gap="md" data-fields data-align-items="end">
              <label>
                Text font
                <select id="text-font" is="searchable-select" data-placeholder="Search text faces…"></select>
              </label>
              <label>
                With music font
                <select id="text-music-font" is="searchable-select" data-placeholder="Search fonts…"></select>
              </label>
            </div>
            <p is="e-p" data-margin-top="sm">
              <span is="e-muted" data-font-size="sm" id="text-says"></span>
            </p>
          </div>

          <div is="e-card" data-width="full" data-padding="lg" data-margin-top="md" data-intake>
            <form is="e-form" data-no-style>
              <div is="e-stack" data-gap="md" data-fields>
                <template
                  is="e-file-upload"
                  data-name="face"
                  data-label-text="Test another text face"
                  data-action-text="Choose .ttf files, or drop them here"
                  data-details-text="Named <Family>-Regular.ttf and <Family>-Bold.ttf — both at once is fine."
                  data-icon-src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' width='24' height='24' fill='none' stroke='%2336454F' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M5 6.5 V4.5 h14 v2'/%3E%3Cpath d='M12 4.5 V19.5'/%3E%3Cpath d='M9 19.5 h6'/%3E%3C/svg%3E"
                  data-validation-absence-error-message="Choose a .ttf first"
                  data-required
                  data-show-errors-in-toast
                  multiple></template>
                <div is="e-row" data-gap="sm" data-margin-top="md" data-keep-flex-direction-row-in-mobile>
                  <button
                    data-primary
                    data-fill="outlined"
                    type="button"
                    data-request-url="/dev/fonts/upload"
                    data-request-method="POST"
                    data-button-ajax-text="adding…"
                    data-response-name="added"
                    onclick="this.form.submit(this)"
                    data-actions-on-response="
                      if (added.statusCode === 200) {
                        showToast(`${added.body.name} added.`)
                        fontsChanged(added.body.name)
                        return
                      }
                      showError(added.body.error || `The server answered ${added.statusCode}.`)
                    ">
                    Add it
                  </button>
                  <div is="e-spacer"></div>
                  <span is="e-muted" data-font-size="sm">
                    Goes into <code is="e-code">src/drawer/font/text</code> and is
                    usable straight away — nothing is generated from it.
                  </span>
                </div>
                <input type="hidden" name="family" value="text">
              </div>
            </form>
          </div>

          <div is="e-panel" data-padding="lg" data-margin-top="lg">
            <h2 is="e-h">Engraved example</h2>
            <p is="e-p">
              <span is="e-muted" data-font-size="sm">
                Everything a text face sets: the title and composer, a subtitle,
                an instrument name, a tempo mark, a text label and a line of
                lyrics with a held syllable.
              </span>
            </p>
            <div id="text-editor" data-editor data-margin-top="sm"></div>
            <!-- The example is a file; this is where it is written. -->
            <div is="e-row" data-gap="sm" data-margin-top="md" data-keep-flex-direction-row-in-mobile>
              <button id="save-text-example" data-primary data-fill="outlined" type="button">
                Save this example
              </button>
              <div is="e-spacer"></div>
              <span is="e-muted" data-font-size="sm" id="text-example-says"></span>
            </div>
          </div>

        </e-tab>

        <!-- ── Chord letters ─────────────────────────────────────────────── -->
        <e-tab data-title="Chord letters">

          <div is="e-card" data-width="full" data-padding="lg" data-margin-top="md">
            <div is="e-row" data-gap="md" data-fields data-align-items="end">
              <label>
                Chord letters font
                <select id="chord-font" is="searchable-select" data-placeholder="Search chord faces…"></select>
              </label>
              <label>
                With music font
                <select id="chord-music-font" is="searchable-select" data-placeholder="Search fonts…"></select>
              </label>
            </div>
            <p is="e-p" data-margin-top="sm">
              <span is="e-muted" data-font-size="sm" id="chord-says"></span>
            </p>
          </div>

          <div is="e-card" data-width="full" data-padding="lg" data-margin-top="md" data-intake>
            <form is="e-form" data-no-style>
              <div is="e-stack" data-gap="md" data-fields>
                <template
                  is="e-file-upload"
                  data-name="face"
                  data-label-text="Test another chord face"
                  data-action-text="Choose a .ttf, or drop one here"
                  data-details-text="Its name becomes the one you write after `chord letters font is`."
                  data-icon-src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' width='24' height='24' fill='none' stroke='%2336454F' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M16.7 7.3 A6.6 6.6 0 1 0 16.7 16.7'/%3E%3C/svg%3E"
                  data-validation-absence-error-message="Choose a .ttf first"
                  data-required
                  data-show-errors-in-toast></template>
                <div is="e-row" data-gap="sm" data-margin-top="md" data-keep-flex-direction-row-in-mobile>
                  <button
                    data-primary
                    data-fill="outlined"
                    type="button"
                    data-request-url="/dev/fonts/upload"
                    data-request-method="POST"
                    data-button-ajax-text="adding…"
                    data-response-name="added"
                    onclick="this.form.submit(this)"
                    data-actions-on-response="
                      if (added.statusCode === 200) {
                        showToast(`${added.body.name} added.`)
                        fontsChanged(added.body.name)
                        return
                      }
                      showError(added.body.error || `The server answered ${added.statusCode}.`)
                    ">
                    Add it
                  </button>
                  <div is="e-spacer"></div>
                  <span is="e-muted" data-font-size="sm">
                    Goes into <code is="e-code">src/drawer/font/chord-letters</code>
                    and is usable straight away.
                  </span>
                </div>
                <input type="hidden" name="family" value="chord-letters">
              </div>
            </form>
          </div>

          <div is="e-panel" data-padding="lg" data-margin-top="lg">
            <h2 is="e-h">Engraved example</h2>
            <p is="e-p">
              <span is="e-muted" data-font-size="sm">
                A progression with the figures the notation asks a chord face to
                set: raised and lowered accidentals, a slash bass, and the
                superscript numerals.
              </span>
            </p>
            <div id="chord-editor" data-editor data-margin-top="sm"></div>
            <!-- The example is a file; this is where it is written. -->
            <div is="e-row" data-gap="sm" data-margin-top="md" data-keep-flex-direction-row-in-mobile>
              <button id="save-chord-example" data-primary data-fill="outlined" type="button">
                Save this example
              </button>
              <div is="e-spacer"></div>
              <span is="e-muted" data-font-size="sm" id="chord-example-says"></span>
            </div>
          </div>

        </e-tab>

      </e-tabs>

    </template>

    <script type="module" src="/js/font-viewer.js"></script>
  </body>
</html>
