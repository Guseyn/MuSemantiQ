<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Font viewer · MuSemantiQ dev tools</title>
  <link rel="preload" href="/html/static-templates/dev-tools-template.html" as="fetch" crossorigin="anonymous">
  <link rel="stylesheet" href="/css/e-ui.css">
  <link rel="stylesheet" href="/css/dev-tools.css">
  <script type="importmap">
    {
      "imports": {
        "#ehtml/": "/js/ehtml/",
        "#ehtml/main": "/js/ehtml/main.js",
        "#e-ui/": "/js/e-ui/",
        "#msq/": "/js/msq/"
      }
    }
  </script>
  <script type="module">
    import '#e-ui/e-dialog.js'
    import '#e-ui/e-confirm.js'
    import '#e-ui/e-toast.js'
    import '#ehtml/main'
  </script>
  <script src="/js/app.js"></script>
  <style>
    #editor { min-height: 340px; }
    #points { width: 100%; min-height: 220px; font-family: var(--e-font-mono); font-size: 12px; }
    [data-metrics] { display: flex; flex-wrap: wrap; gap: var(--e-spacing-md); }
  </style>
</head>
<body>
  <template
    is="e-wrapper"
    data-src="/html/static-templates/dev-tools-template.html"
    data-where-to-place="main > div"
    data-how-to-place="inside">

    <h1 is="e-h">Font viewer</h1>
    <p is="e-p">
      <span is="e-muted">
        Trace a glyph out of a SMuFL font, see it engraved where it is actually used,
        and write the result back into the music-js font.
      </span>
    </p>

    <div is="e-card" data-width="full" data-padding="lg" data-margin-top="md">
      <div is="e-row" data-gap="md" data-fields data-align-items="end">
        <label>
          Music font
          <select id="font" is="searchable-select" data-placeholder="Search fonts…"></select>
        </label>
        <label>
          Glyph table entry
          <select id="entry" is="searchable-select" data-placeholder="Search glyph entries…"></select>
        </label>
        <label>
          Character or U+XXXX
          <input id="codepoint" value="U+E050" spellcheck="false">
        </label>
        <label>
          Font size (× interval)
          <input id="size" type="number" value="4.0" step="0.005" min="0.1">
        </label>
        <label>
          Interval between stave lines
          <input id="interval" type="number" value="8.5" step="0.5" min="1">
        </label>
        <label>
          yCorrection
          <input id="correction" type="number" step="0.01" spellcheck="false">
        </label>
      </div>
    </div>

    <div is="e-panel" data-padding="lg" data-margin-top="lg">
      <h2 is="e-h">Engraved example</h2>
      <div id="editor"></div>
      <p is="e-p"><span is="e-muted" data-font-size="sm" id="status"></span></p>
    </div>

    <div is="e-panel" data-padding="lg" data-margin-top="lg">
      <h2 is="e-h">Points</h2>
      <div data-metrics id="metrics" data-margin-bottom="md"></div>
      <textarea id="points" spellcheck="false" readonly></textarea>
      <div is="e-row" data-gap="sm" data-margin-top="md" data-keep-flex-direction-row-in-mobile>
        <button id="apply" data-primary type="button">Apply</button>
        <button id="copy" data-primary data-fill="outlined" type="button">Copy points</button>
      </div>
      <p is="e-p" data-margin-top="md">
        <span is="e-muted" data-font-size="sm">
          Apply writes the points and the yCorrection above into
          <code is="e-code">src/drawer/font/music-js/&lt;font&gt;.js</code> for the selected
          entry. Nothing on disk changes until you press it.
        </span>
      </p>
    </div>

  </template>

<script type="module" src="/js/font-viewer.js"></script>
</body>
</html>
