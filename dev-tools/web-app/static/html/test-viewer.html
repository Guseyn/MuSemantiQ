<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test viewer · MuSemantiQ dev tools</title>
    <link rel="preload" href="/html/static-templates/dev-tools-template.html" as="fetch" crossorigin="anonymous">
    <link rel="stylesheet" href="/css/e-ui.css">
    <link rel="stylesheet" href="/css/dev-tools.css">
    <script type="importmap">
      {
        "imports": {
          "#ehtml/": "/js/ehtml/",
          "#ehtml/main": "/js/ehtml/main.js",
          "#e-ui/": "/js/e-ui/",
          "#msq/": "/js/msq/web-components/",
          "#msq-worker/": "/js/msq/worker/"
        }
      }
    </script>
    <script type="module">
      import '#e-ui/e-tab.js'
      import '#e-ui/e-dialog.js'
      import '#e-ui/e-confirm.js'
      import '#e-ui/e-toast.js'
      import '#ehtml/main'
    </script>
    <script src="/js/app.js"></script>
    <style>
      :root {
        --e-primary: #222f3e;
        --e-fg: #222f3e;
      }
      /*
      The two panes sit in a row, each asking for the full width and allowed to
      shrink, so they settle at half each and scroll on their own. Comparing two
      tall scores therefore never grows the page. An e-row centres its children by
      default; these should line up at the top.
      */
      div[is="e-row"][data-sides] { align-items: flex-start; }
      [data-side] { min-width: 0; display: flex; flex-direction: column; }
      /*
      A score is drawn at the size it was engraved rather than squeezed into half
      a pane, so the detail being compared is actually readable, and the box it
      sits in scrolls both ways. The minimum height is what stops a short example
      giving you a letterbox to peer through.
      */
      [data-scrolls] {
        min-height: 60vh;
        max-height: 78vh;
        margin-top: var(--e-spacing-sm);
      }
      [data-score] { background: #fff; border-radius: var(--e-radius-md); }
      [data-side] img { display: block; max-width: none; }
      [data-sounds] { margin-top: var(--e-spacing-sm); }
      [data-side] pre {
        white-space: pre-wrap; word-break: break-word;
        font-size: 11px; line-height: 1.45; margin: 0;
      }
      [data-artifact-list] { display: flex; flex-wrap: wrap; gap: var(--e-spacing-xs); }
      [data-artifact-list] button[data-current="true"] { outline: 2px solid var(--e-primary); }
    </style>
  </head>
  <body>
    <template
      is="e-wrapper"
      data-src="/html/static-templates/dev-tools-template.html"
      data-where-to-place="main > div > hr"
      data-how-to-place="after">

      <h1 is="e-h">Test viewer</h1>
      <p is="e-p">
        <span is="e-muted">
          Pick a test, compare what the last run produced against the committed baseline,
          and adopt the new one when it is the output you meant.
        </span>
      </p>


      <!--
      What is being looked at, narrowest first: which kind of test, then which
      suite of that kind, then which test. A tab holds no content of its own —
      it chooses the suite underneath it, and everything below is redrawn.
      -->
      <e-tabs id="suites" data-apply-hash-navigation data-margin-top="md">
        <e-tab data-title="Visual"></e-tab>
        <e-tab data-title="Audio"></e-tab>
      </e-tabs>

      <!-- One button per suite of the chosen kind, read off the test folders:
           the visual tests run the same corpus once per font. -->
      <div id="suite-picker"></div>

      <div is="e-card" data-width="full" data-padding="md" data-margin-top="md" data-fields>
        <label>
          Test
          <select id="test" is="searchable-select" data-placeholder="Search tests…"></select>
        </label>
        <!--
        The corpus is walked as often as it is searched: a whole prefix at a
        time, looking for the one that came out wrong. Editing sits at the end of
        that row, because it and the deletion act on whichever test the walk has
        arrived at.
        -->
        <div is="e-row" data-gap="sm" data-margin-top="sm">
          <button id="previous-test" data-primary data-fill="outlined" type="button">← Previous</button>
          <button id="next-test" data-primary data-fill="outlined" type="button">Next →</button>
          <span is="e-muted" data-font-size="sm" id="test-place"></span>
          <div is="e-spacer"></div>
          <button id="edit-test" data-primary data-fill="outlined" type="button">Edit test</button>
          <button id="delete-test" data-primary data-fill="danger" type="button">Delete test</button>
        </div>
      </div>

      <!-- After the panel, because it makes a test rather than acting on the
           one the panel has chosen. -->
      <button id="add-test" data-primary type="button" data-margin-top="md">Add test</button>

      <!--
      Adding a test writes one file per suite of that kind — the same music in
      each, carrying its own `music font is` line. A corpus where bravura has a
      test that leland does not is a corpus that has stopped comparing anything,
      so the choice is not offered.
      -->
      <dialog is="e-dialog" id="new-test" data-close-icon="">
        <h2 is="e-h" id="new-test-title">A new test</h2>
        <p is="e-p">
          <span is="e-muted" data-font-size="sm">
            The music is written into every suite of this kind, and the suite is
            then run over this one test — so what it produces is up to date the
            moment you save. Only the <code is="e-code">actual</code> side is
            written; the baseline is what you adopt here, once you have looked at
            it.
          </span>
        </p>
        <form is="e-form" data-width="full" data-no-style>
          <div is="e-stack" data-gap="md" data-fields>
            <label>
              Name
              <input
                id="new-test-name"
                name="test"
                placeholder="pitch-accidentals"
                spellcheck="false"
                required
                data-validation-pattern="^[A-Za-z0-9][A-Za-z0-9_-]*$"
                data-validation-absence-error-message="Give it a name"
                data-validation-error-message="Letters, digits, dashes and underscores — and no dots">
            </label>
            <!--
            The music is written in the editor itself, so the score is there to
            look at while you write it rather than after you have saved. The
            form still needs a value to send, so the editor's text is copied
            into the field below on the way out.
            -->
            <div>
              <span is="e-muted" data-font-size="sm">
                MSQ — press the pencil in the editor to write, and the eye to see
                what it draws.
              </span>
              <div id="new-test-editor" data-margin-top="sm"></div>
            </div>
            <input
              type="hidden"
              id="new-test-msq"
              name="msq"
              required
              data-validation-absence-error-message="Write some MSQ for it">
            <input type="hidden" id="new-test-kind" name="kind" value="visual">

            <div is="e-row" data-gap="sm" data-margin-top="md" data-keep-flex-direction-row-in-mobile>
              <button
                data-primary
                type="button"
                id="write-test"
                data-request-url="/dev/tests/new"
                data-request-method="POST"
                data-button-ajax-text="writing and running…"
                data-response-name="added"
                onclick="
                  (() => {
                    // The editor holds the music; the form sends this field.
                    const written = musicInTheDialog()
                    if (!written) {
                      return showError('Write some MSQ for it first.')
                    }
                    changeValueOf('#new-test-msq', written)
                    this.form.submit(this)
                  })()
                "
                data-actions-on-response="
                  if (added.statusCode === 200) {
                    showToast(`${added.body.test} written into ${added.body.wrote.join(' and ')}` +
                      `${added.body.ran ? ' — it passes.' : ', and it differs from its baseline.'}`)
                    testWritten(added.body.test)
                    return
                  }
                  showError(added.body.error || `The server answered ${added.statusCode}.`)
                ">
                Write it
              </button>
              <div is="e-spacer"></div>
              <span is="e-muted" data-font-size="sm" id="new-test-says"></span>
            </div>
          </div>
        </form>
      </dialog>

      <div id="viewer" data-margin-top="lg"></div>

    </template>

    <script type="module" src="/js/test-viewer.js"></script>
  </body>
</html>
