<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MuSemantiQ documentation</title>
    <meta
      name="description"
      content="Documentation for MuSemantiQ: the MSQ language, the JavaScript API, the web components and the tools."
    >
    <link rel="stylesheet" href="/css/e-ui.css">
    <link rel="stylesheet" href="/css/docs.css">

    <script type="importmap">
      {
        "imports": {
          "#ehtml/": "/js/ehtml/",
          "#ehtml/main": "/js/ehtml/main.js",
          "#e-ui/": "/js/e-ui/",
          "#msq/web-components/": "/js/msq/web-components/",
          "#msq/language/": "/js/msq/language/",
          "#docs/": "/js/docs/",
          "#mermaid": "/js/docs/lib/mermaid/mermaid.esm.mjs"
        }
      }
    </script>

    <!--
      Before anything else, and not a module: it decides how the sidebar opens,
      and e-sidebar reads that decision the moment EHTML activates it.
    -->
    <script src="/js/docs/app.js"></script>

    <script type="module">
      /*
      Safari does not implement customized built-in elements — <template is="…">,
      which the msq, e-ui and EHTML elements all are — so this polyfill goes first,
      before anything defines one. EHTML imports it too, but only once main.js
      runs, after the elements above it are defined. It is the same URL, so it
      still runs once: it has no guard against being run twice.
      */
      import '#ehtml/third-party/custom-elements-polyfill.js'

      /*
      The msq elements are plain custom elements driven by connectedCallback, so
      defining them here is enough for any that markdown inserts later.

      '#ehtml/main' goes last. Every e-ui component waits for the
      'ehtml:activated' event and does nothing at all until EHTML dispatches it.
      */
      import '#msq/web-components/msq-font-loader-template.js'
      import '#msq/web-components/msq-svg-template.js'
      import '#msq/web-components/msq-midi-template.js'
      import '#msq/web-components/msq-svg-midi-template.js'
      import '#msq/web-components/msq-editor-template.js'

      import '#e-ui/e-sidebar.js'
      import '#e-ui/e-kbd.js'
      // The tabs some pages write in their markdown
      import '#e-ui/e-tab.js'
      // A click on a heading's share link copies its address; the diagrams of ```mermaid fences
      import '#docs/e-h.js'
      import '#docs/docs-diagram.js'
      // The sitemap and the page the URL names, for the templates below.
      import '#docs/docs.js'
      // Every code block's "copy" link (its ::before).
      import '#docs/copy-code.js'
      // <nav is="docs-contents">, a page's contents built from its headings.
      import '#docs/docs-contents.js'
      import '#ehtml/main'

      /*
      e-markdown takes extensions through data-internal-state, which is an
      expression, so this one is a global. The e-markdown that uses it is inside
      the font loader and is activated long after this has run.
      */
      import showdownHighlight from '#ehtml/showdown/extensions/highlight.js'
      window.showdownHighlight = showdownHighlight

      /*
      ```msq-svg, ```msq-midi, ```msq-svg-midi and ```msq-editor fences become
      those elements, with the fonts the loader below registers. A global for
      the same reason as the highlighting.
      */
      import msqExtensions from '/js/showdown-extensions/msqExtensions.js'
      window.msqExtensions = msqExtensions

      // Every markdown table as e-ui's <table is="e-table">. A global as well.
      import eTableExtension from '#docs/e-table-extension.js'
      window.eTableExtension = eTableExtension
      // <e-tabs>, <e-tab> and <details is="e-details"> written in a page's markdown
      import eBlocksExtension from '#docs/e-blocks-extension.js'
      window.eBlocksExtension = eBlocksExtension
      // ```mermaid fences as <docs-diagram>
      import diagramExtension from '#docs/diagram-extension.js'
      window.diagramExtension = diagramExtension
      // Every heading as <h… is="e-h">, with its share link
      import eHeadingExtension from '#docs/e-heading-extension.js'
      window.eHeadingExtension = eHeadingExtension
    </script>
  </head>

  <body>
    <!--
      Used on narrow screens while the sidebar is open: it dims the page, and a
      click on it closes the sidebar (e-sidebar finds it by data-mobile-body-overlay).
    -->
    <div is="overlay"></div>

    <!--
      The mobile header. e-ui shows it only below 981px and moves main down to
      make room for it, and e-sidebar puts its menu button in here. It has to be
      the element right before e-sidebar for that offset to apply.
    -->
    <header is="e-header">
      <a href="/" data-logo>
        <img src="/images/logo.svg" alt="MuSemantiQ">
      </a>
      <a is="e-link" href="https://github.com/Guseyn/MuSemantiQ">GitHub</a>
    </header>

    <e-sidebar
      data-side="left"
      data-mobile-header='header[is="e-header"]'
      data-mobile-menu-icon="/images/menu.svg"
      data-mobile-body-overlay="div[is='overlay']"
      data-show-scrollbar
    >
      <!--
        All three of header, nav and footer have to be here: e-sidebar observes
        the first and the last without checking they exist.
      -->
      <header>
        <a href="/" data-logo data-hide-on-sidebar-closed>
          <img src="/images/logo.svg" alt="MuSemantiQ">
        </a>
        <button
          is="e-with-icon"
          type="button"
          aria-label="Expand sidebar"
          data-hide-on-sidebar-open
          onclick="document.querySelector('e-sidebar').open()"
        >
          <img alt="" aria-hidden="true" src="/images/menu.svg">
        </button>
      </header>

      <kbd
        is="e-kbd"
        data-absolute
        aria-label="Toggle sidebar open or closed. Shortcut: Shift S"
        aria-keyshortcuts="Shift+S"
        data-action="
          const sidebar = document.querySelector('e-sidebar')
          if (sidebar.getAttribute('data-state') === 'open') {
            sidebar.close()
          } else {
            sidebar.open()
          }
        "
      >
        ⇧ + S
      </kbd>

      <nav aria-label="Documentation">
        <!--
          The sitemap, rendered. Each section of several pages is a collapsible
          e-details, so the sidebar opens as a short list of every section rather
          than one long column that hides the later ones below the fold, and so
          is each group inside a section. Collapsed, the sidebar is e-ui's icon
          rail and only the section icons show.

          Icons are data-src, not src: an img with src starts loading the moment
          a clone lands in the document, before EHTML has filled in ${...}.
        -->
        <div data-toc>
          <template is="e-for-each" data-list-to-iterate="${sitemap}" data-item-name="section">
            <!--
              A section of one page is that page, so it is a link rather than a
              details with a single entry to open. It keeps the section's icon
              and heading, so the sidebar and the rail read the same either way.
            -->
            <template is="e-if" data-condition-to-display="${section.pages !== undefined && section.pages.length === 1}">
              <a
                href="/docs/${section.slug}/${section.pages[0].slug}"
                title="${section.title}"
                data-section-link
                data-section="${section.slug}"
                data-selected="${currentPage !== null && currentPage.section === section.slug}"
              >
                <img data-src="/images/sidebar/${section.slug}.svg" alt="" aria-hidden="true">
                <span data-text="${section.title}"></span>
              </a>
            </template>
            <template is="e-if" data-condition-to-display="${section.pages === undefined || section.pages.length !== 1}">
              <details
                is="e-details"
                data-section="${section.slug}"
                data-current="${currentPage !== null && currentPage.section === section.slug}"
              >
                <!--
                  On the rail a section is only an icon, and toggling it would open
                  a list nobody can see. So there a click opens the sidebar on that
                  section instead.
                -->
                <summary
                  title="${section.title}"
                  onclick="
                    const sidebar = document.querySelector('e-sidebar')
                    if (sidebar.getAttribute('data-state') !== 'open') {
                      event.preventDefault()
                      this.parentElement.open = true
                      sidebar.open()
                    }
                  "
                >
                  <img data-src="/images/sidebar/${section.slug}.svg" alt="" aria-hidden="true">
                  <span data-text="${section.title}"></span>
                </summary>
                <div>
                  <template is="e-for-each" data-list-to-iterate="${section.pages || []}" data-item-name="page">
                    <a
                      href="/docs/${section.slug}/${page.slug}"
                      data-selected="${currentPage !== null && currentPage.ref === section.slug + '/' + page.slug}"
                    ><span data-text="${page.title}"></span></a>
                  </template>
                  <template is="e-for-each" data-list-to-iterate="${section.groups || []}" data-item-name="group">
                    <details
                      is="e-details"
                      data-group
                      data-current="${currentPage !== null && currentPage.section === section.slug && currentPage.group === group.title}"
                    >
                      <summary data-text="${group.title}"></summary>
                      <div>
                        <template is="e-for-each" data-list-to-iterate="${group.pages}" data-item-name="page">
                          <a
                            href="/docs/${section.slug}/${page.slug}"
                            data-selected="${currentPage !== null && currentPage.ref === section.slug + '/' + page.slug}"
                          ><span data-text="${page.title}"></span></a>
                        </template>
                      </div>
                    </details>
                  </template>
                  <template is="e-for-each" data-list-to-iterate="${section.links || []}" data-item-name="link">
                    <a href="${link.href}" target="_blank" rel="noopener" data-external>
                      <img data-src="${link.icon}" alt="" aria-hidden="true">
                      <span data-text="${link.title}"></span>
                    </a>
                  </template>
                </div>
              </details>
            </template>
          </template>
        </div>

        <hr is="e-divider" data-hide-on-sidebar-closed data-hide-in-mobile>
        <div is="e-info" data-hide-on-sidebar-closed data-hide-in-mobile>
          <div is="e-stack" data-gap="xs">
            <div is="e-row" data-gap="md" data-keep-flex-direction-row-in-mobile>
              <kbd
                is="e-kbd"
                aria-label="Pin sidebar closed. Shortcut: Shift P"
                aria-keyshortcuts="Shift+P"
                data-action="
                  document.querySelector('e-sidebar').close()
                  localStorage.setItem('sidebarIsPinned', 'true')
                "
              >
                ⇧ + P
              </kbd>
              <span data-font-size="xs">Pin Sidebar (Keep It Closed)</span>
            </div>
            <div is="e-row" data-gap="md" data-keep-flex-direction-row-in-mobile>
              <kbd
                is="e-kbd"
                aria-label="Unpin sidebar. Shortcut: Shift U"
                aria-keyshortcuts="Shift+U"
                data-action="
                  document.querySelector('e-sidebar').open()
                  localStorage.removeItem('sidebarIsPinned')
                "
              >
                ⇧ + U
              </kbd>
              <span data-font-size="xs">Unpin Sidebar</span>
            </div>
          </div>
        </div>
      </nav>

      <footer>
        <div is="e-row" data-keep-flex-direction-row-in-mobile data-hide-on-sidebar-closed>
          <span data-font-size="sm">
            Created by <a is="e-link" href="https://guseyn.com">Guseyn</a>
          </span>
          <div is="e-stack" data-gap="3xs">
            <button
              is="e-with-icon"
              type="button"
              aria-label="Collapse sidebar"
              data-height="md"
              onclick="document.querySelector('e-sidebar').close()"
            >
              <img alt="" aria-hidden="true" src="/images/sidebar/collapse.svg">
            </button>
            <kbd is="e-kbd" aria-hidden="true">⇧ + S</kbd>
          </div>
        </div>
      </footer>
    </e-sidebar>

    <main is="e-main">
      <article data-content>
        <noscript>
          <h1>MuSemantiQ documentation</h1>
          <p>
            The documentation is assembled in the browser, so JavaScript has to
            be enabled to read it.
          </p>
        </noscript>

        <template is="e-if" data-condition-to-display="${currentPage === null}">
          <div>
            <h1>No such page</h1>
            <p>Nothing in the documentation answers to this address.</p>
          </div>
        </template>

        <!--
          The font loader unwraps its content only once the worker has the fonts,
          so the markdown, and every example in it, waits for them for free and
          finds them by name.

          e-markdown has no error path: whatever body comes back is rendered. So
          the /md mount answers a missing page with a markdown file of its own,
          which says it has not been written yet (see docs/web-app/worker.js).

          Code is highlighted only where the fence names its language: an
          unlabelled fence is usually MSQ, which highlight.js would guess wrong.

          The section and the group of the page open once the page starts
          loading; by then the sidebar above has been rendered.
        -->
        <template is="e-if" data-condition-to-display="${currentPage !== null}">
          <template
            is="msq-font-loader"
            data-font-sources-reference="msqFontSources"
            data-font-config-src="/js/font-config.json"
          >
            <e-markdown
              data-src="${currentPage.md}"
              data-internal-state="${{ extensions: [ msqExtensions({ fontSources: 'msqFontSources' }), showdownHighlight({ auto_detection: false }), eTableExtension(), eBlocksExtension(), diagramExtension(), eHeadingExtension() ] }}"
              data-actions-on-progress-start="
                document
                  .querySelectorAll('e-sidebar nav details[data-current=true]')
                  .forEach((details) => { details.open = true })
              "
            ></e-markdown>
          </template>
        </template>
      </article>
    </main>
  </body>
</html>
