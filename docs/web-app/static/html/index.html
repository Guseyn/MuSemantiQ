<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MuSemantiQ — sheet music, written with words</title>
    <meta
      name="description"
      content="MuSemantiQ is a toolkit for writing sheet music with words. It engraves what you write as an SVG score and plays it back, the same way every time."
    >
    <meta name="color-scheme" content="light">
    <link rel="stylesheet" href="/css/landing.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    >
    <script type="importmap">
      {
        "imports": {
          "#ehtml/": "/js/ehtml/",
          "#ehtml/main": "/js/ehtml/main.js",
          "#msq/web-components/": "/js/msq/web-components/",
          "#msq/language/": "/js/msq/language/",
          "#docs/": "/js/docs/"
        }
      }
    </script>
    <script type="module">
      import '#ehtml/main'

      import '#msq/web-components/msq-font-loader-template.js'
      import '#msq/web-components/msq-svg-template.js'
      import '#msq/web-components/msq-midi-template.js'
      import '#msq/web-components/msq-svg-midi-template.js'
      import '#msq/web-components/msq-editor-template.js'

      import '/js/landing/landing-screen.js'
      import '/js/landing/landing-rail.js'
      import '/js/landing/landing-phrase.js'
      import '/js/landing/landing-scroll-hint.js'
      import '/js/landing/landing-tabs.js'

      // Every code block's "copy" link (its ::before).
      import '#docs/copy-code.js'

      // The one diagram of "How it works": the arrows between its blocks.
      import '/js/landing/landing-diagram.js'

      import showdownHighlight from '#ehtml/showdown/extensions/highlight.js'
      import msqExtensions from '/js/showdown-extensions/msqExtensions.js'

      window.showdownHighlight = showdownHighlight
      window.msqExtensions = msqExtensions
    </script>
  </head>

  <body>
    <!-- Built from the screens by landing-rail, so there is one list to change. -->
    <nav is="landing-rail" data-rail aria-label="Sections"></nav>

    <!-- ── 01 ─────────────────────────────────────────────────────────── -->
    <section is="landing-screen" data-screen id="start" data-number="00" data-label="Start">
      <div data-inner data-hero>
        <a href="/" data-logo aria-label="MuSemantiQ" data-reveal></a>

        <h1 data-reveal style="--d: 80ms">
          Sheet music,<br>written with words
        </h1>

        <div is="landing-phrase" data-stave data-phrase aria-hidden="true">
          <e-svg data-src="/images/phrase.svg"></e-svg>
        </div>

        <p data-actions data-reveal style="--d: 280ms">
          <a data-button href="/docs">Read the docs</a>
          <a data-link href="https://github.com/Guseyn/MuSemantiQ">GitHub</a>
        </p>
      </div>

      <a is="landing-scroll-hint" data-scroll-hint href="#see" aria-label="Scroll to the demo video">
        <span></span>
      </a>
    </section>

    <section is="landing-screen" data-screen id="video" data-number="01" data-label="Demo Video">
      <div data-inner data-hero>

        <h1 data-reveal style="--d: 80ms">
          Watch Demo Video
        </h1>

        <p data-to-write data-reveal style="--d: 80ms">
          PUT VIDEO HERE
        </p>
      </div>

      <a is="landing-scroll-hint" data-scroll-hint href="#see" aria-label="Scroll to the example">
        <span></span>
      </a>
    </section>

    <!--
      One loader, wrapping everything that engraves. The first screen is
      outside it and paints immediately; the scores appear once the fonts are
      registered, which is over before anyone has scrolled.
    -->
    <template
      is="msq-font-loader"
      data-font-sources-reference="msqFontSources"
      data-font-config-src="/js/font-config.json"
    >
      <main data-screens>

        <!-- ── 02 ───────────────────────────────────────────────────────── -->
        <section is="landing-screen" data-screen id="see" data-number="02" data-label="See it">
          <div data-inner data-wide>
            <h2 data-reveal>You write the words. It writes the music.</h2>

            <div data-figure data-reveal style="--d: 160ms">

                tuplet 3 in first measure on first stave from first chord to 3rd chord down
                tuplet 3 in first measure on first stave from 4th chord to 6th chord down
                tuplet 3 in first measure on second stave from first chord to 3rd chord up
                tuplet 3 in first measure on second stave from 4th chord to 6th chord up
              </template>
            </div>
          </div>
        </section>

        <!-- ── 03 ───────────────────────────────────────────────────────── -->
        <section is="landing-screen" data-screen id="features" data-number="03" data-label="What you get">
          <div data-inner data-wide>
            <h2 data-reveal>What you get</h2>
            <ul data-icon-list>
              <li data-reveal style="--d: 60ms">
                <span data-icon aria-hidden="true">translate</span>
                <div data-icon-text>
                  <h3>Language</h3>
                  <p>One command a line, structured and readable, and every error visible in the input.</p>
                </div>
              </li>
              <li data-reveal style="--d: 120ms">
                <span data-icon aria-hidden="true">api</span>
                <div data-icon-text>
                  <h3>Low level API</h3>
                  <p>Plain JavaScript modules: set up the fonts once, parse a page, then make an SVG and a MIDI file from it.</p>
                </div>
              </li>
              <li data-reveal style="--d: 180ms">
                <span data-icon aria-hidden="true">image</span>
                <div data-icon-text>
                  <h3>SVG Renderer</h3>
                  <p>One engraved score per page, as an SVG that every browser can draw.</p>
                </div>
              </li>
              <li data-reveal style="--d: 240ms">
                <span data-icon aria-hidden="true">widgets</span>
                <div data-icon-text>
                  <h3>Native web components</h3>
                  <p>The score, the player and the editor as elements: no build step, and nothing to configure but the fonts.</p>
                </div>
              </li>
              <li data-reveal style="--d: 300ms">
                <span data-icon aria-hidden="true">extension</span>
                <div data-icon-text>
                  <h3>Showdown extensions</h3>
                  <p>MSQ inside a markdown document becomes a score, highlighted like the editor’s own text.</p>
                </div>
              </li>
              <li data-reveal style="--d: 360ms">
                <span data-icon aria-hidden="true">terminal</span>
                <div data-icon-text>
                  <h3>CLI app</h3>
                  <p>The whole pipeline from a terminal: a file, some text or a pipe in; SVG, MIDI and page schemas out.</p>
                </div>
              </li>
              <li data-reveal style="--d: 420ms">
                <span data-icon aria-hidden="true">construction</span>
                <div data-icon-text>
                  <h3>Dev tools</h3>
                  <ul data-icon-sublist>
                    <li>
                      <span data-icon aria-hidden="true">music_note</span>
                      <span>Music Font Generator (using SMuFL)</span>
                    </li>
                    <li>
                      <span data-icon aria-hidden="true">graphic_eq</span>
                      <span>Sound Font Generator (for Magenta)</span>
                    </li>
                  </ul>
                </div>
              </li>
            </ul>
          </div>
        </section>

        <!-- ── 04 ───────────────────────────────────────────────────────── -->
        <section is="landing-screen" data-screen id="how" data-number="04" data-label="How it works">
          <div data-inner data-widest>
            <h2 data-reveal>How it works</h2>
            <p data-reveal style="--d: 60ms">
              One small page, all the way through: words in, and a score, a performance and the editor’s colours out.
            </p>
            <div is="landing-diagram" data-pipeline data-reveal style="--d: 120ms">
              <svg data-arrows aria-hidden="true"></svg>
              <div data-block="words">
                <span data-icon aria-hidden="true">description</span>
                <span data-name>Words</span>
              </div>
              <div data-block="custom-styles">
                <span data-icon aria-hidden="true">palette</span>
                <span data-name>Custom styles</span>
              </div>
              <div data-block="page-styles">
                <span data-icon aria-hidden="true">format_paint</span>
                <span data-name>Page styles</span>
              </div>
              <div data-block="page-schema">
                <span data-icon aria-hidden="true">data_object</span>
                <span data-name>Page schema</span>
              </div>
              <div data-block="midi-settings">
                <span data-icon aria-hidden="true">piano</span>
                <span data-name>MIDI settings</span>
              </div>
              <div data-block="highlights-buffer">
                <span data-icon aria-hidden="true">highlight</span>
                <span data-name>Highlights buffer</span>
              </div>
              <div data-block="svg">
                <span data-icon aria-hidden="true">image</span>
                <span data-name>SVG</span>
              </div>
              <div data-block="midi">
                <span data-icon aria-hidden="true">music_note</span>
                <span data-name>MIDI</span>
              </div>
              <div data-block="comments">
                <span data-icon aria-hidden="true">sticky_note_2</span>
                <span data-name>Comments</span>
              </div>
              <div data-block="errors">
                <span data-icon aria-hidden="true">error</span>
                <span data-name>Errors</span>
              </div>
              <div data-block="command-map">
                <span data-icon aria-hidden="true">account_tree</span>
                <span data-name>Command map</span>
              </div>
              <div data-block="editor-autocomplete">
                <span data-icon aria-hidden="true">lightbulb</span>
                <span data-name>Editor autocomplete</span>
              </div>
              <div data-block="highlights">
                <span data-icon aria-hidden="true">edit_note</span>
                <span data-name>Editor highlights</span>
              </div>
                <div data-block="errors">
                  <span data-icon aria-hidden="true">error</span>
                  <span data-name>Errors</span>
                </div>
                <div data-block="command-map">
                  <span data-icon aria-hidden="true">account_tree</span>
                  <span data-name>Command map</span>
                </div>
              </div>
            </div>
          </div>
        </section>

        <!-- ── 05 ───────────────────────────────────────────────────────── -->
        <section is="landing-screen" data-screen id="toolkit" data-number="05" data-label="Powerful toolkit">
          <div data-inner data-widest>
            <h2 data-reveal>Powerful toolkit</h2>
            <p data-reveal style="--d: 60ms">
              The same engine, wherever you need it: in Node, in a browser worker, as elements in a page, in markdown, and on the command line.
            </p>

            <div is="landing-tabs" data-tabs data-reveal style="--d: 120ms">
              <div data-tab-list aria-label="The toolkit">
                <button type="button" data-tab="api">Low-level API</button>
                <button type="button" data-tab="worker">API with worker</button>
                <button type="button" data-tab="components">Web components</button>
                <button type="button" data-tab="showdown">Showdown extensions</button>
                <button type="button" data-tab="cli">CLI</button>
                <button type="button" data-tab="dev-tools">Dev tools</button>
              </div>

              <div data-tab-panel="api">
                <p>
                  Plain JavaScript modules, in Node or anywhere else: set up the fonts once, parse a page, then make an SVG and a MIDI file from it. Every step in between is yours to read or change.
                </p>
                <div data-split>
                  <div data-code>
                    <e-markdown
                      data-src="/md/landing/toolkit/api.md"
                      data-internal-state="${{ extensions: [ showdownHighlight({ auto_detection: false }) ] }}"
                    ></e-markdown>
                  </div>
                  <figure data-live data-picture>
                    <img src="/images/pipeline/score.svg" alt="The score that code writes: a treble clef and the notes c, d, e, f and g">
                    <figcaption>
                      <code>score.svg</code>, as written by the code, and
                      <a data-link href="/images/pipeline/example.mid" download><code>score.mid</code></a>.
                      More in <a data-link href="/docs/api/overview">Low-level API</a>.
                    </figcaption>
                  </figure>
                </div>
              </div>

              <div data-tab-panel="worker">
                <p>
                  The same API in a web worker, so engraving never blocks the page. Every request is a message with a name and an id, and its answer comes back with the same id.
                </p>
                <div data-split>
                  <div data-code>
                    <e-markdown
                      data-src="/md/landing/toolkit/worker.md"
                      data-internal-state="${{ extensions: [ showdownHighlight({ auto_detection: false }) ] }}"
                    ></e-markdown>
                  </div>
                  <div data-live>
                    <table data-messages>
                      <thead>
                        <tr><th>Message</th><th>Answer</th></tr>
                      </thead>
                      <tbody>
                        <tr><td><code>fonts.setup</code></td><td><code>status: 'ok'</code>, once the fonts are registered under a reference</td></tr>
                        <tr><td><code>svg.generate</code></td><td><code>svg</code>, <code>svgDataSrc</code> and <code>errors</code></td></tr>
                        <tr><td><code>midi.generate</code></td><td><code>midiDataSrc</code> and <code>errors</code></td></tr>
                        <tr><td><code>svg.midi.generate</code></td><td>both, with the maps that tie notes to moments</td></tr>
                        <tr><td><code>svg.midi.text.generate</code></td><td>both, and the highlighted text</td></tr>
                      </tbody>
                    </table>
                    <p>It is what every element on this page talks to.</p>
                  </div>
                </div>
              </div>

              <div data-tab-panel="components">
                <p>
                  Write the music inside an element, and the element becomes a score, a player or an editor. No build step, and nothing to configure but the fonts.
                </p>
                <div is="landing-tabs" data-tabs data-subtabs>
                  <div data-tab-list aria-label="The web components">
                    <button type="button" data-tab="msq-font-loader"><code>msq-font-loader</code></button>
                    <button type="button" data-tab="msq-svg"><code>msq-svg</code></button>
                    <button type="button" data-tab="msq-midi"><code>msq-midi</code></button>
                    <button type="button" data-tab="msq-svg-midi"><code>msq-svg-midi</code></button>
                    <button type="button" data-tab="msq-editor"><code>msq-editor</code></button>
                  </div>
                  <div data-tab-panel="msq-svg">
                    <p>The score, and nothing else.</p>
                    <div data-split>
                      <div data-code>
                        <e-markdown
                          data-src="/md/landing/toolkit/msq-svg.md"
                          data-internal-state="${{ extensions: [ showdownHighlight({ auto_detection: false }) ] }}"
                        ></e-markdown>
                      </div>
                      <div data-live>
                        <template
                          is="msq-svg"
                          data-font-sources="msqFontSources"
                        >
                          measure
                          treble clef
                          time signature is 4:4
                          1/8 g beamed, a, b, c5 not beamed
                          1/2 d5
                        </template>
                      </div>
                    </div>
                  </div>
                  <div data-tab-panel="msq-midi">
                    <p>A player, with no score and no fonts.</p>
                    <div data-split>
                      <div data-code>
                        <e-markdown
                          data-src="/md/landing/toolkit/msq-midi.md"
                          data-internal-state="${{ extensions: [ showdownHighlight({ auto_detection: false }) ] }}"
                        ></e-markdown>
                      </div>
                      <div data-live>
                        <template
                          is="msq-midi"
                        >
                          measure
                          treble clef
                          time signature is 4:4
                          1/8 g beamed, a, b, c5 not beamed
                          1/2 d5
                        </template>
                      </div>
                    </div>
                  </div>
                  <div data-tab-panel="msq-svg-midi">
                    <p>The score and a player: every note lights up as it sounds, and a click on a note jumps the player there.</p>
                    <div data-split>
                      <div data-code>
                        <e-markdown
                          data-src="/md/landing/toolkit/msq-svg-midi.md"
                          data-internal-state="${{ extensions: [ showdownHighlight({ auto_detection: false }) ] }}"
                        ></e-markdown>
                      </div>
                      <div data-live>
                        <template
                          is="msq-svg-midi"
                          data-font-sources="msqFontSources"
                        >
                          measure
                          treble clef
                          time signature is 4:4
                          1/8 g beamed, a, b, c5 not beamed
                          1/2 d5
                        </template>
                      </div>
                    </div>
                  </div>
                  <div data-tab-panel="msq-editor">
                    <p>Write on one side, see and hear it on the other. ⌘ or Ctrl + click goes from a word to what it drew, and back.</p>
                    <div data-split>
                      <div data-code>
                        <e-markdown
                          data-src="/md/landing/toolkit/msq-editor.md"
                          data-internal-state="${{ extensions: [ showdownHighlight({ auto_detection: false }) ] }}"
                        ></e-markdown>
                      </div>
                      <div data-live>
                        <template
                          is="msq-editor"
                          data-font-sources="msqFontSources"
                          data-editor-height="220px"
                        >
                          measure
                          treble clef
                          time signature is 4:4
                          1/8 g beamed, a, b, c5 not beamed
                          1/2 d5
                        </template>
                      </div>
                    </div>
                  </div>
                  <div data-tab-panel="msq-font-loader">
                    <p>It draws nothing itself: it registers the fonts once, and every element inside it finds them by name. This whole page is inside one.</p>
                    <div data-code>
                      <e-markdown
                        data-src="/md/landing/font-loader.md"
                        data-internal-state="${{ extensions: [ showdownHighlight({ auto_detection: false }) ] }}"
                      ></e-markdown>
                    </div>
                  </div>
                </div>
              </div>

              <div data-tab-panel="showdown">
                <p>
                  Showdown extensions turn a fenced block named after an element into that element, so a page written in markdown can hold real scores. This page renders the markdown on the left, live, on the right.
                </p>
                <div data-split>
                  <div>
                    <div data-code>
                      <e-markdown
                        data-src="/md/landing/toolkit/showdown-markdown.md"
                        data-internal-state="${{ extensions: [ showdownHighlight({ auto_detection: false }) ] }}"
                      ></e-markdown>
                    </div>
                    <div data-code>
                      <e-markdown
                        data-src="/md/landing/toolkit/showdown-js.md"
                        data-internal-state="${{ extensions: [ showdownHighlight({ auto_detection: false }) ] }}"
                      ></e-markdown>
                    </div>
                  </div>
                  <div data-live data-markdown-result>
                    <e-markdown
                      data-src="/md/landing/toolkit/showdown-live.md"
                      data-internal-state="${{ extensions: [ msqExtensions({ fontSources: 'msqFontSources' }) ] }}"
                    ></e-markdown>
                  </div>
                </div>
              </div>

              <div data-tab-panel="dev-tools">
                <p>
                  A second app for the work around the music: the fonts, the sound and the tests. It runs on your machine, against your working tree, and what it changes shows up in <code>git status</code>.
                </p>
                <ul data-tools>
                  <li data-tool>
                    <span data-icon aria-hidden="true">draw</span>
                    <div>
                      <h4><a data-link href="/docs/dev-tools/font-viewer">Font viewer</a></h4>
                      <p>Traces one glyph at a time out of a music font, engraves it in real music, and writes the tuned glyph back into the font's table.</p>
                    </div>
                  </li>
                  <li data-tool>
                    <span data-icon aria-hidden="true">font_download</span>
                    <div>
                      <h4><a data-link href="/docs/dev-tools/font-generator">Font generator</a></h4>
                      <p>Turns any SMuFL <code>.otf</code> into the music-js font the drawer reads, so a new music font is a file away.</p>
                    </div>
                  </li>
                  <li data-tool>
                    <span data-icon aria-hidden="true">graphic_eq</span>
                    <div>
                      <h4><a data-link href="/docs/dev-tools/soundfont-generator">Soundfont generator</a></h4>
                      <p>Renders a General MIDI <code>.sf2</code> soundbank into the sample sets the MIDI player loads, one instrument at a time.</p>
                    </div>
                  </li>
                  <li data-tool>
                    <span data-icon aria-hidden="true">fact_check</span>
                    <div>
                      <h4><a data-link href="/docs/dev-tools/test-viewer">Test viewer</a></h4>
                      <p>Shows what the last test run produced beside the committed baseline, and adopts the new one when it is what you meant.</p>
                    </div>
                  </li>
                </ul>
                <p data-tools-start>
                  Set them up once with <code>npm run dev-tools:setup</code>, start them with <code>npm run dev-tools</code>, then open <a data-link href="https://127.0.0.1:8889">127.0.0.1:8889</a>. More in <a data-link href="/docs/dev-tools/overview">Dev tools</a>.
                </p>
              </div>

              <div data-tab-panel="cli">
                <p>
                  The whole pipeline from a terminal: a file, a folder, some text or a pipe in; SVG, MIDI, page schemas and highlighted HTML out.
                </p>
                <div data-split>
                  <div data-code>
                    <e-markdown
                      data-src="/md/landing/toolkit/cli.md"
                      data-internal-state="${{ extensions: [ showdownHighlight({ auto_detection: false }) ] }}"
                    ></e-markdown>
                  </div>
                  <div data-live>
                    <table data-messages>
                      <thead>
                        <tr><th>Flag</th><th>What you get</th></tr>
                      </thead>
                      <tbody>
