<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MuSemantiQ — sheet music, written with words</title>
    <meta
      name="description"
      content="MuSemantiQ is a toolkit for writing sheet music with words. It engraves what you write as an SVG score and plays it back, the same way every time."
    >
    <meta name="color-scheme" content="light">

    <!--
      No e-ui here. It is a design system for tools — the dev tools and the
      documentation use it — and this page is neither. Its tokens are its own.
    -->
    <link rel="stylesheet" href="/css/landing.css">

    <script type="importmap">
      {
        "imports": {
          "#msq/web-components/": "/js/msq/web-components/",
          "#msq/language/": "/js/msq/language/"
        }
      }
    </script>
    <script type="module">
      import '#msq/web-components/msq-font-loader-template.js'
      import '#msq/web-components/msq-svg-template.js'
      import '#msq/web-components/msq-midi-template.js'
      import '#msq/web-components/msq-svg-midi-template.js'
      import '#msq/web-components/msq-editor-template.js'
    </script>
  </head>

  <body>
    <!-- Built from the screens by landing.js, so there is one list to change. -->
    <nav data-rail aria-label="Sections"></nav>

    <!-- ── 01 ─────────────────────────────────────────────────────────── -->
    <section data-screen id="start" data-number="01" data-label="Start">
      <div data-inner data-hero>
        <a href="/" data-logo aria-label="MuSemantiQ" data-reveal></a>

        <h1 data-reveal style="--d: 80ms">
          Sheet music,<br>written with words
        </h1>

        <!--
          A real engraved phrase, drawn by the engine from eight words of MSQ
          and animated into place: the stave rules itself, then the notes
          arrive, then the beams join them. A page about writing music with
          words should not be decorated with a picture of music, so this is
          not one — see scripts/generate-landing-art.js. Filled by landing.js.
        -->
        <div data-stave data-phrase aria-hidden="true"></div>

        <p data-lede data-to-write data-reveal style="--d: 200ms">
          TO WRITE — one sentence saying what it is, in the reader's terms
          rather than the project's. Then one more on who it is for. Nothing
          else: the example on the next screen is the argument.
        </p>

        <p data-actions data-reveal style="--d: 280ms">
          <a data-button href="/docs">Read the docs</a>
          <a data-link href="https://github.com/Guseyn/MuSemantiQ">GitHub</a>
        </p>
      </div>

      <a data-scroll-hint href="#see" aria-label="Scroll to the example">
        <span></span>
      </a>
    </section>

    <!--
      One loader, wrapping everything that engraves. The first screen is
      outside it and paints immediately; the scores appear once the fonts are
      registered, which is over before anyone has scrolled.
    -->

      is="msq-font-loader"
      data-font-sources-reference="msqFontSources"
      data-font-config-src="/js/font-config.json"
    >
    <main data-screens>

      <!-- ── 02 ───────────────────────────────────────────────────────── -->

      <!-- ── 03 ───────────────────────────────────────────────────────── -->
      <section data-screen id="features" data-number="03" data-label="What you get">
        <div data-inner data-wide>
          <h2 data-reveal>What you get</h2>

          <!--
            One feature at a time, with the next one just showing at the edge so
            it is clear there is more. The row is the thing that scrolls; the
            buttons move it by exactly one card, and the edges are masked so a
            card leaves by fading rather than by being cut off.

            The drawings are placeholders. Each says what its card is about in
            the page's own hairline vocabulary; replace them as the prose lands.
          -->
          <div data-carousel data-reveal style="--d: 80ms">
            <div data-carousel-viewport>
              <ul data-cards>
                <li data-card>
                  <!--
                    Deterministic: the four-point spark that has come to mean
                    "generated", struck through. It reads at a glance, which a
                    little diagram of a neural net does not.
                  -->
                  <svg data-art viewBox="0 0 64 64" aria-hidden="true">
                    <path d="M32 13l4.5 14.5L51 32l-14.5 4.5L32 51l-4.5-14.5L13 32l14.5-4.5z"/>
                    <path d="M13 51L51 13"/>
                  </svg>
                  <h3>Deterministic</h3>
                  <p data-to-write>
                    TO WRITE — the same input gives the same output, every time,
                    on every machine. It is a parser and an engraver, not a
                    model: no inference cost, no network call, and nothing
                    invented that you did not write. A score is a text file, so
                    it diffs and merges and lives in version control. Make the
                    contrast without naming competitors.
                  </p>
                </li>

                <li data-card>
                  <!-- Free: a lock standing open. -->
                  <svg data-art viewBox="0 0 64 64" aria-hidden="true">
                    <rect x="14" y="30" width="36" height="24" rx="2"/>
                    <path d="M24 30v-8a8 8 0 0 1 16 0"/>
                    <path d="M32 39v6"/>
                  </svg>
                  <h3>Free</h3>
                  <p data-to-write>
                    TO WRITE — the licence in one sentence, what it asks for,
                    and a link to the full text.
                  </p>
                </li>

                <li data-card>
                  <!-- Extendable: three blocks and a dashed slot for the next. -->
                  <svg data-art viewBox="0 0 64 64" aria-hidden="true">
                    <rect x="10" y="22" width="16" height="16"/>
                    <rect x="30" y="22" width="16" height="16"/>
                    <rect x="10" y="42" width="16" height="16"/>
                    <rect x="30" y="42" width="16" height="16" stroke-dasharray="3 3"/>
                    <path d="M38 47v6M35 50h6"/>
                  </svg>
                  <h3>Extendable</h3>
                  <p data-to-write>
                    TO WRITE — your own fonts, your own tools, and an open page
                    schema that other programs can read and write.
                  </p>
                </li>

                <li data-card>
                  <!-- Customizable: every knob is a written command. -->
                  <svg data-art viewBox="0 0 64 64" aria-hidden="true">
                    <path d="M12 22h40M12 32h40M12 42h40"/>
                    <circle cx="24" cy="22" r="4"/>
                    <circle cx="40" cy="32" r="4"/>
                    <circle cx="19" cy="42" r="4"/>
                  </svg>
                  <h3>Customizable</h3>
                  <p data-to-write>
                    TO WRITE — every style knob is a written command, so how a
                    score looks is part of the document rather than a setting
                    kept somewhere else.
                  </p>
                </li>

                <li data-card>
                  <!-- Navigable: words on the left, a note on the right, both ways. -->
                  <svg data-art viewBox="0 0 64 64" aria-hidden="true">
                    <path d="M8 22h16M8 28h12M8 34h16M8 40h10"/>
                    <ellipse cx="46" cy="40" rx="6" ry="4.5" transform="rotate(-20 46 40)"/>
                    <path d="M52 39V20"/>
                    <path d="M26 50h24M26 50l4-3M26 50l4 3M50 50l-4-3M50 50l-4 3"/>
                  </svg>
                  <h3>Navigable</h3>
                  <p data-to-write>
                    TO WRITE — the score and the source are linked both ways.
                    Say what Cmd/Ctrl-clicking a note does, and why that matters
                    in a long piece.
                  </p>
                </li>
              </ul>

                  <svg data-stage-art viewBox="0 0 48 48" aria-hidden="true">

                  </svg>
                  <span>Words</span>
                </button>
              </li>
              <li data-stage="parser">
                <button type="button" data-stage-button>

              </li>

                    <path d="M30 8c5 0 6 3 6 7s0 7 5 9c-5 2-5 5-5 9s-1 7-6 7"/>

              </li>

                    <rect x="9" y="7" width="30" height="34" rx="2"/>

                    <ellipse cx="20" cy="30" rx="4" ry="3"/>
                    <path d="M24 29V17"/>
                  </svg>
                  <span>SVG</span>
                </button>
                <button type="button" data-stage-button data-output="midi">

                <button type="button" data-stage-button data-output="highlights">

                  <span>Editor highlights</span>
                </button>
              </li>
            </ol>

            <div data-flow-notes>
              <div data-note-for="words">
                <h3>Words</h3>
                <p data-to-write>
                  TO WRITE — what the source is: plain text, line oriented, and
                  readable as English. Say that a bare list of note names is
                  already a valid document.
                </p>
              </div>
              <div data-note-for="parser">
                <h3>Parser</h3>
                <p data-to-write>
                  TO WRITE — that it recognises commands rather than matching a
                  grammar, that it never throws, and that anything it does not
                  understand is reported with its line number instead of
                  stopping the page.
                </p>
              </div>
              <div data-note-for="schema">
                <h3>Page schema</h3>
                <p data-to-write>
                  TO WRITE — the pivot. Say that everything downstream reads
                  this and nothing downstream reads the text, so it is the
                  thing to write a tool against. One line on its shape:
                  measures, staves, voices, units.
                </p>
              </div>
              <div data-note-for="svg">
                <h3>SVG</h3>
                <p data-to-write>
                  TO WRITE — one image per page, engraved rather than laid out:
                  say what the drawer decides for you.
                </p>
              </div>
              <div data-note-for="midi">
                <h3>MIDI</h3>
                <p data-to-write>
                  TO WRITE — one performance for the whole document. What is
                  honoured — repeats, tempo, dynamics, ornaments — and what is
                  not.
                </p>
              </div>
              <div data-note-for="musicxml">
                <h3>MusicXML</h3>
                <p data-to-write>
                  TO WRITE — both directions, and an honest sentence on what is
                  lost each way. Say that what cannot be imported is named in a
                  report rather than quietly dropped.
                </p>
              </div>
              <div data-note-for="highlights">
                <h3>Editor highlights</h3>
                <p data-to-write>
                  TO WRITE — the same parse, rendered as coloured HTML with a
                  reference id on every element. That is what links a note in
                  the score back to the word that drew it.
                </p>
              </div>
            </div>
          </div>
        </div>
      </section>
